version: '3.8'

services:
  polymarket-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-mcp
    image: polymarket-mcp:latest

    # Environment variables (loaded from .env file)
    environment:
      # Required for trading (read from .env)
      - POLYGON_PRIVATE_KEY=${POLYGON_PRIVATE_KEY}
      - POLYGON_ADDRESS=${POLYGON_ADDRESS}

      # Optional API credentials (if you have them)
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY:-}
      - POLYMARKET_API_SECRET=${POLYMARKET_API_SECRET:-}
      - POLYMARKET_PASSPHRASE=${POLYMARKET_PASSPHRASE:-}
      - POLYMARKET_API_KEY_NAME=${POLYMARKET_API_KEY_NAME:-}
      - POLYMARKET_SIGNATURE_TYPE=3
      - POLYMARKET_FUNDER=${POLYMARKET_FUNDER:-}

      # Operating mode
      - DEMO_MODE=${DEMO_MODE:-false}
      - POLYMARKET_ENV=${POLYMARKET_ENV}

      # Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLYMARKET_CHAIN_ID=${POLYMARKET_CHAIN_ID}
      - POLYMARKET_TEST_CHAIN_ID=${POLYMARKET_TEST_CHAIN_ID}
      - WS_ENABLED=${WS_ENABLED:-true}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - MCP_STREAMABLE_HTTP_HOST=${MCP_STREAMABLE_HTTP_HOST:-0.0.0.0}
      - MCP_STREAMABLE_HTTP_PORT=${MCP_STREAMABLE_HTTP_PORT:-8000}
      - MCP_STREAMABLE_HTTP_PATH=${MCP_STREAMABLE_HTTP_PATH:-/mcp}

      # Safety limits (optional overrides)
      - MAX_ORDER_SIZE_USD=${MAX_ORDER_SIZE_USD:-1000}
      - MAX_TOTAL_EXPOSURE_USD=${MAX_TOTAL_EXPOSURE_USD:-5000}
      - MAX_POSITION_SIZE_PER_MARKET=${MAX_POSITION_SIZE_PER_MARKET:-2000}
      - MIN_LIQUIDITY_REQUIRED=${MIN_LIQUIDITY_REQUIRED:-10000}
      - MAX_SPREAD_TOLERANCE=${MAX_SPREAD_TOLERANCE:-0.05}
      - ENABLE_AUTONOMOUS_TRADING=${ENABLE_AUTONOMOUS_TRADING:-true}
      - REQUIRE_CONFIRMATION_ABOVE_USD=${REQUIRE_CONFIRMATION_ABOVE_USD:-500}
      - AUTO_CANCEL_ON_LARGE_SPREAD=${AUTO_CANCEL_ON_LARGE_SPREAD:-true}
      - CLOB_API_URL=${CLOB_API_URL}
      - GAMMA_API_URL=${GAMMA_API_URL}
      - CLOB_API_TEST_URL=${CLOB_API_TEST_URL}
      - GAMMA_API_TEST_URL=${GAMMA_API_TEST_URL}
      - POLYMARKET_GEOBLOCK_URL=${POLYMARKET_GEOBLOCK_URL:?POLYMARKET_GEOBLOCK_URL is required}
      - USDC_ADDRESS=${USDC_ADDRESS}
      - CTF_EXCHANGE_ADDRESS=${CTF_EXCHANGE_ADDRESS}
      - CONDITIONAL_TOKEN_ADDRESS=${CONDITIONAL_TOKEN_ADDRESS}

      # Optional: Redis cache (leave empty to use built-in in-memory cache)
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}

    ports:
      - "${MCP_STREAMABLE_HTTP_PORT:-8000}:${MCP_STREAMABLE_HTTP_PORT:-8000}"

    # Volume for persistent logs
    volumes:
      - ./logs:/app/logs
      - polymarket-data:/app/data

    # Restart policy for reliability
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (optional - adjust based on needs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network mode (use default bridge)
    network_mode: bridge

volumes:
  polymarket-data:
    driver: local

# ============================================================================
# Optional Redis service for shared / persistent caching
# ============================================================================
# To enable Redis caching:
#   1. Uncomment the redis service below (and the redis-data volume).
#   2. Add "depends_on: [redis]" to the polymarket-mcp service.
#   3. Set either REDIS_URL=redis://redis:6379/0 or REDIS_HOST=redis + REDIS_PORT=6379.
#   4. Install the redis extra: pip install 'polymarket-mcp[redis]'
#
# When REDIS_URL is not set the server uses its built-in in-memory cache
# automatically — no further configuration needed.
#
# services:
#   redis:
#     image: redis:7-alpine
#     container_name: polymarket-redis
#     restart: unless-stopped
#     volumes:
#       - redis-data:/data
#     healthcheck:
#       test: ["CMD", "redis-cli", "ping"]
#       interval: 10s
#       timeout: 3s
#       retries: 3
#
# volumes:
#   redis-data:
#     driver: local
